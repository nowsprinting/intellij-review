name: Release

on:
  release:
    types: [ prereleased, released ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Set Version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i "s/^pluginVersion=.*/pluginVersion=$VERSION/" gradle.properties

      - name: Patch Changelog
        run: ./gradlew --no-configuration-cache patchChangelog

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache publishPlugin -PbuildVersion=$VERSION

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip

      - name: Create Pull Request for Changelog
        if: ${{ !contains(github.event.release.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          BRANCH="changelog-update-$VERSION"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "Update changelog after ${{ github.event.release.tag_name }} release"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update changelog after ${{ github.event.release.tag_name }} release" \
            --body "Automated changelog update after publishing ${{ github.event.release.tag_name }}." \
            --base master \
            --head "$BRANCH"
